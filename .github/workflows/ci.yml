name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & tests
    runs-on: ubuntu-latest
    # Lint, format and the full test suite finish in about ten seconds. The
    # old three-minute budget was sized for a site build that never ran here
    # (it cannot — see the note where that step used to be); this is headroom
    # for a cold `pnpm install`, nothing more.
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v7

      # CI, compose.yaml and the Dockerfile pin the same pnpm version. If one
      # of them drifts, a lockfile that installs here can fail there.
      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v6
        with:
          version: "12.21.0"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      # Bun is not optional in this repo: `pnpm test` is
      # `bun test src worker scripts`, and `pnpm run build` starts with
      # `bun scripts/check-digest-frontmatter.ts`. Without Bun installed every
      # command that shells out to it exits 127 — which is what made this
      # workflow fail instantly, before it ever reached the build. Installed
      # before dependencies because `postinstall` and the test runner need it.
      - name: "🥟 Install Bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧪 Run tests"
        run: pnpm test

      # There is deliberately no build step here.
      #
      # `pnpm run build` renders the American Legal Digest corpus, and that
      # corpus is NOT in this repository. src/corpus.config.ts defaults
      # CORPUS_DIR to ../key-digest-runner/key_digest/american_legal_digest/okf
      # — a sibling checkout of the private key-digest-runner repo — and
      # src/content.config.ts globs every content collection out of that
      # directory when the config loads. On a fresh runner the path does not
      # exist, so the build dies while loading content, before any page code
      # runs: it can only ever fail for a missing private checkout, never for
      # a defect in this repository. That is why every PR, including main's
      # own HEAD, was red.
      #
      # The real build is verified by the deploy pipeline, on the machine that
      # has the corpus (`pnpm run deploy:full`: ~27 minutes, 24 GB heap). What
      # CI can honestly check is what is actually here: lint, format, tests.
      #
      # The incremental-build cache that used to live here is gone with it —
      # it cached node_modules/.astro, which only a real build fills.
