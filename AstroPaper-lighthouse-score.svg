<svg
  class="theme--agnostic"
  fill="none"
  height="330"
  width="1000"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  <style>
    .gauge-base {
      opacity: 0.1;
    }

    .gauge-arc {
      fill: none;
      animation-delay: 250ms;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 100px 60px;
      animation: load-gauge 1s ease forwards;
    }

    .gauge-text {
      font-family: monospace;
      font-size: 40px;
      text-align: center;
    }

    .gauge-red {
      color: #ff4e42;
      fill: #ff4e42;
      stroke: #ff4e42;
    }
    .gauge-orange {
      color: #ffa400;
      fill: #ffa400;
      stroke: #ffa400;
    }
    .gauge-green {
      color: #0cce6b;
      fill: #0cce6b;
      stroke: #0cce6b;
    }
    .theme--agnostic .gauge-undefined {
      color: #5c5c5c;
      fill: #5c5c5c;
      stroke: #5c5c5c;
    }
    .theme--light .gauge-undefined {
      color: #1e1e1e;
      fill: #1e1e1e;
      stroke: #1e1e1e;
    }
    .theme--dark .gauge-undefined {
      color: #f5f5f5;
      fill: #f5f5f5;
      stroke: #f5f5f5;
    }

    .gauge-title {
      font-family: Roboto, Halvetica, Arial, sans-serif;
      font-size: 26px;
      line-height: 26px;
      stroke: none;
    }
    .metric.gauge-title {
      font-family: "Courier New", Courier, monospace;
    }
    .theme--agnostic .gauge-title {
      color: #737373;
      fill: #737373;
    }
    .theme--light .gauge-title {
      color: #212121;
      fill: #212121;
    }
    .theme--dark .gauge-title {
      color: #f5f5f5;
      fill: #f5f5f5;
    }

    @keyframes load-gauge {
      from {
        stroke-dasharray: 0 352.858;
      }
    }
    .lh-gauge--pwa__disc {
      fill: #e0e0e0;
    }
    .lh-gauge--pwa__logo {
      position: relative;
      fill: #b0b0b0;
    }
    .lh-gauge--pwa__invisible {
      display: none;
    }
    .lh-gauge--pwa__visible {
      display: inline;
    }
    .gauge-invisible {
      display: none;
    }
    .lh-gauge--pwa__logo--primary-color {
      fill: #304ffe;
    }
    .theme--agnostic .lh-gauge--pwa__logo--secondary-color {
      fill: #787878;
    }
    .theme--light .lh-gauge--pwa__logo--secondary-color {
      fill: #3d3d3d;
    }
    .theme--dark .lh-gauge--pwa__logo--secondary-color {
      fill: #d8b6b6;
    }
    .theme--light #svg_2 {
      stroke: #00000022;
    }
    .theme--agnostic #svg_2 {
      stroke: #616161;
    }
    .theme--light #svg_2 {
      stroke: #00000022;
    }
    .theme--dark #svg_2 {
      stroke: #f5f5f566;
    }
  </style>
  <svg
    class="gauge-div gauge-perf gauge-green"
    height="200"
    viewBox="0 0 200 200"
    width="200"
    x="100"
    y="0"
  >
    <circle class="gauge-base" cx="100" cy="60" r="56" stroke-width="8" />
    <circle
      class="gauge-arc gauge-arc-1"
      cx="100"
      cy="60"
      r="56"
      stroke-width="8"
      style="stroke-dasharray: 351.858, 351.858;"
    />
    <text
      alignment-baseline="central"
      class="gauge-text"
      dominant-baseline="central"
      text-anchor="middle"
      x="100px"
      y="60px"
    >
      100
    </text>
    <text
      alignment-baseline="central"
      class="gauge-title"
      dominant-baseline="central"
      text-anchor="middle"
      x="100px"
      y="160px"
    >
      Performance
    </text>
